<html lang="zh-CN">

    <style>
    :root{
      /* ===== 蓝色主题配色 ===== */
      --brand:#2563EB;
      --brand-2:#3B82F6;
      --brand-deep:#1D4ED8;
      --brand-ink:#1E3A8A;
      --brand-soft:#EFF4FF;
      --bg:#EDF2FB;
      --panel:#ffffff;
      --text:#1B2537;
      --text-sub:#5A6577;
      --muted:#93A0B4;
      --border:#E4EAF4;
      --border-strong:#D3DDEC;
      /* ===== 兼容既有变量名 ===== */
      --bubble-user:linear-gradient(135deg,#3B82F6,#2563EB);
      --bubble-bot:#ffffff;
      --shadow:0 20px 50px -20px rgba(30,58,138,.32), 0 4px 14px rgba(30,58,138,.06);
    }
    *{box-sizing:border-box}
    ::-webkit-scrollbar{width:9px;height:9px}
    ::-webkit-scrollbar-thumb{background:#C6D2E6;border-radius:9px}
    ::-webkit-scrollbar-thumb:hover{background:#A9BAD4}
    ::-webkit-scrollbar-track{background:transparent}

    body{
      margin:0;
      font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
      color:var(--text);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
      background:
        radial-gradient(1000px 580px at 10% -12%, #E1EBFF 0%, rgba(225,235,255,0) 60%),
        radial-gradient(880px 520px at 112% 112%, #E6EEFF 0%, rgba(230,238,255,0) 58%),
        var(--bg);
    }
    .app{
      width:100%;
      max-width:1000px;
      height:min(840px,94vh);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    /* ========== 顶栏（蓝色渐变）========== */
    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 20px;
      background:linear-gradient(120deg,#1E3A8A 0%,#2563EB 52%,#3B82F6 100%);
      color:#fff;
      flex:0 0 auto;
      box-shadow:0 8px 22px -12px rgba(30,58,138,.65);
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:230px}
    .logo{
      width:44px;height:44px;border-radius:14px;
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.38);
      display:flex;align-items:center;justify-content:center;
      font-size:19px;color:#fff;font-weight:600;
      flex:0 0 auto;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
    }
    .title{display:flex;flex-direction:column;line-height:1.2}
    .title strong{font-size:15.5px;font-weight:600;color:#fff;letter-spacing:.3px}
    .title span{font-size:12px;color:rgba(255,255,255,.76);margin-top:4px}
    .top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
    .pill{
      font-size:12px;color:rgba(255,255,255,.88);
      border:1px solid rgba(255,255,255,.26);
      padding:6px 11px;border-radius:999px;
      background:rgba(255,255,255,.14);
      display:inline-flex;align-items:center;gap:6px;
    }
    .pill::before{
      content:"";width:7px;height:7px;border-radius:50%;
      background:rgba(255,255,255,.55);flex:0 0 auto;
    }
    .pill.ok{color:#EAFBF3;border-color:rgba(120,240,190,.5);background:rgba(18,166,106,.3)}
    .pill.ok::before{background:#4ADE80}
    .pill.bad{color:#FFECEC;border-color:rgba(255,150,150,.5);background:rgba(229,72,77,.32)}
    .pill.bad::before{background:#FF8B8B}
    .btn{
      border:1px solid rgba(255,255,255,.3);
      background:rgba(255,255,255,.16);
      color:#fff;
      padding:8px 15px;
      border-radius:999px;
      font-size:12px;
      font-family:inherit;
      cursor:pointer;
      transition:background .2s;
    }
    .btn:hover{background:rgba(255,255,255,.3)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .stream-toggle{
      font-size:12px;display:flex;align-items:center;gap:5px;
      cursor:pointer;user-select:none;color:rgba(255,255,255,.88);margin-right:4px;
    }
    .stream-toggle input{accent-color:#93C5FD;cursor:pointer}

    /* ========== 对话区 ========== */
    .chat{
      flex:1;
      overflow:auto;
      padding:20px 22px 12px;
      background:linear-gradient(180deg,#F8FAFF 0%,#F1F5FE 100%);
    }
    .dayline{
      text-align:center;
      color:var(--muted);
      font-size:12px;
      margin:6px 0 16px;
      display:flex;align-items:center;gap:12px;
    }
    .dayline::before,.dayline::after{content:"";flex:1;height:1px;background:var(--border)}
    .msg{
      display:flex;
      gap:12px;
      margin:14px 0;
      align-items:flex-end;
      animation:msgIn .32s ease;
    }
    @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .msg.user{justify-content:flex-end}
    /* 关键：只让“消息内容容器”(排除头像)在 flex 中可伸缩，避免被压到“1 个字宽”导致竖排换行 */
    .msg > div:not(.avatar){
      flex:1;
      min-width:0;
    }
    .msg.user > div:not(.avatar){
      display:flex;
      flex-direction:column;
      align-items:flex-end;
    }
    .avatar{
      width:40px;height:40px;border-radius:50%;
      background:#DCE7FF;
      color:var(--brand-deep);
      border:1px solid #C6D8FF;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;
      font-weight:600;
      flex:0 0 auto;
    }
    .avatar.bot{
      background:linear-gradient(135deg,#3B82F6,#1D4ED8);
      color:#fff;font-size:12.5px;
      border-color:transparent;
      box-shadow:0 6px 14px -6px rgba(37,99,235,.75);
    }
    .bubble{
      max-width:min(720px,76%);
      display:inline-block;
      border-radius:14px;
      padding:11px 14px;
      border:1px solid var(--border);
      background:var(--bubble-bot);
      position:relative;
      line-height:1.6;
      font-size:14px;
      white-space:pre-wrap;
      overflow-wrap:break-word;
      box-shadow:0 2px 8px rgba(30,58,138,.07);
    }
    .msg.user .bubble{
      background:var(--bubble-user);
      color:#fff;
      border-color:transparent;
      border-bottom-right-radius:4px;
      box-shadow:0 8px 20px -10px rgba(37,99,235,.85);
    }
    /* 机器人消息：头像置顶（与回答第一行对齐），而不是压在内容底部 */
    .msg.bot{align-items:flex-start}
    .msg.bot .avatar{margin-top:2px}
    .msg.bot .bubble{border-bottom-left-radius:4px}
    .meta{
      font-size:11px;
      color:var(--muted);
      margin-top:7px;
    }
    .msg.user .meta{color:#A9BAD4}
    details.progress{
      margin-top:9px;
      border:1px solid var(--border);
      border-radius:12px;
      padding:9px 11px;
      background:#F7FAFF;
    }
    details.progress summary{
      cursor:pointer;
      user-select:none;
      color:var(--brand-deep);
      font-size:12px;
      font-weight:600;
    }
    .progress ul{margin:8px 0 0 18px;padding:0}
    .progress li{margin:4px 0;font-size:12px;color:var(--text-sub)}

    .answer-images{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .answer-images img{
      display:block;
      max-width:min(100%,600px);
      max-height:600px;
      width:auto;
      height:auto;
      border-radius:12px;
      border:1px solid var(--border);
      box-shadow:0 2px 8px rgba(30,58,138,.07);
      background:#fff;
    }
    .answer-images a{
      font-size:12px;
      color:var(--muted);
      text-decoration:none;
      word-break:break-all;
    }
    .answer-images a:hover{color:var(--brand)}

    .typing{
      display:inline-flex;gap:6px;align-items:center;
    }
    .dot{
      width:7px;height:7px;border-radius:50%;
      background:#A9BAD4;
      animation:bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{
      0%,80%,100%{transform:translateY(0);opacity:.6}
      40%{transform:translateY(-5px);opacity:1}
    }

    /* ========== 输入区 ========== */
    .composer{
      border-top:1px solid var(--border);
      padding:14px 20px;
      display:flex;
      gap:12px;
      align-items:flex-end;
      background:#fff;
    }
    textarea{
      flex:1;
      resize:none;
      min-height:48px;
      max-height:150px;
      padding:13px 15px;
      border-radius:14px;
      border:1px solid var(--border-strong);
      outline:none;
      font-size:14px;
      line-height:1.5;
      font-family:inherit;
      background:#F8FAFF;
      transition:border-color .2s,box-shadow .2s,background .2s;
    }
    textarea::placeholder{color:#A9BAD4}
    textarea:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
    .send{
      width:104px;
      height:48px;
      border:none;
      border-radius:14px;
      cursor:pointer;
      font-size:15px;
      font-weight:600;
      font-family:inherit;
      color:#fff;
      background:linear-gradient(135deg,#3B82F6,#2563EB);
      transition:background .2s,opacity .2s,transform .1s;
      box-shadow:0 10px 22px -10px rgba(37,99,235,.95);
    }
    .send:hover:not(:disabled){background:linear-gradient(135deg,#2563EB,#1D4ED8)}
    .send:active:not(:disabled){transform:translateY(1px)}
    .send:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
    .hint{
      padding:0 20px 14px;
      color:var(--muted);
      font-size:12px;
      background:#fff;
    }
    .kbd{
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
      border:1px solid var(--border);
      padding:1px 6px;
      border-radius:6px;
      background:#F5F8FF;
      color:var(--brand-deep);
    }

    /* ========== 窄屏适配 ========== */
    @media (max-width:760px){
      body{padding:0;height:auto;min-height:100vh;align-items:stretch}
      .app{height:auto;min-height:100vh;max-width:none;border:none;border-radius:0}
      .brand{min-width:0}
      .title span{display:none}
      .topbar{padding:12px 14px}
      .chat{padding:16px 13px 12px}
      .composer{padding:11px 13px}
      .hint{padding:0 13px 12px}
      .bubble{max-width:88%}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo">度</div>
        <div class="title">
          <strong>小度小度</strong>
          <span id="subTitle">在线 · 可查询知识库与联网信息</span>
        </div>
      </div>
      <div class="top-actions">
        <label class="stream-toggle">
          <input type="checkbox" id="streamToggle" checked> 流式输出
        </label>
        <span class="pill" id="apiPill">API: 未连接</span>
        <button class="btn" id="btnClear">清空对话</button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="dayline">今天</div>
      <div class="msg bot" data-welcome="1">
        <div class="avatar bot">小度</div>
        <div>
          <div class="bubble">你好，我是小度小度助手。你可以直接提问，我会在“阶段进度”里展示处理过程。</div>
          <div class="meta">提示：可以问“如何使用万用表测量电压？”</div>
        </div>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="send">发送</button>
    </div>
    <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</div>
  </div>

  <script>
    // 默认同源；如你把页面单独打开（file://），可改成 http://127.0.0.1:8001
    const API_BASE = `${location.protocol}//${location.host}`.includes('http') ? `${location.protocol}//${location.host}` : 'http://127.0.0.1:8001';
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const apiPill = document.getElementById('apiPill');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');

    // Session ID Logic
    let sessionId = localStorage.getItem('kb_session_id');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('kb_session_id', sessionId);
    }

    function scrollToBottom(){
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    // 流式输出专用滚动策略：以"本条回答的首行"作为滚动锚点。
    //   回答还没长到一屏时 → 目标值被 maxScroll 夹住，表现为"跟随滚动"；
    //   回答首行升到问答框顶部后 → 滚动位置就锁死在"首行贴顶"，不再继续下滚，
    //   文字只会向下自然生长，不会出现"边生成边把整段回答往上顶走"的割裂感。
    function scrollStreamAnchor(msgEl){
      if(!msgEl || !msgEl.isConnected) return;
      const padTop = parseFloat(getComputedStyle(chatEl).paddingTop) || 0;
      const contentTop = chatEl.getBoundingClientRect().top + chatEl.clientTop;
      // 首行在"内容坐标系"里的位置（与当前滚动位置无关，是常量）
      const anchorTop = msgEl.getBoundingClientRect().top - contentTop + chatEl.scrollTop;
      const maxScroll = chatEl.scrollHeight - chatEl.clientHeight;
      // 目标：首行停在容器顶部（保留 padding 留白），但不能滚过头
      const target = Math.min(maxScroll, Math.max(0, anchorTop - padTop));
      if(target > chatEl.scrollTop) chatEl.scrollTop = target; // 只向下滚，绝不回跳
    }
    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function formatTime(ts){
      if(!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if(Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function isImageUrl(url){
      // 增加宽松度，有些 url 可能后面跟了奇怪的参数
      // 只要包含 .jpg .png 等扩展名，且后面是 ? # 或 结束，或者被某些标点截断前
      // 简单判断：路径部分以图片后缀结尾
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        // 如果 new URL 失败（比如相对路径或非法字符），退回正则匹配
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }

    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      if(!s) return '';
      // 尽量保留原始 URL，但把空格编码，避免 img src 失败
      return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr){
      const seen = new Set();
      const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v) continue;
        if(seen.has(v)) continue;
        seen.add(v);
        out.push(v);
      }
      return out;
    }

    function extractUrlsLoose(text){
      const s = String(text || '');
      // 简单正则提取：匹配 http/https 开头，直到遇到空白字符
      // [^\s] 包含中文、特殊符号等，直到遇到换行或空格
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = s.match(regex) || [];
      const urls = [];
      
      // 去除首尾标点
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');

      for(const m of matches){
        let u = trimHeadPunct(trimTailPunct(m));
        // 简单清洗可能混入的结尾
        if(u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }

    function parseImagesFromTextLoosely(text){
      const urls = extractUrlsLoose(text).filter(isImageUrl);
      return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      // 支持多种写法：【图片】、【 图片 】、[图片]、[ 图片 ]
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m;
      let lastIdx = -1;
      let lastLen = 0;
      while((m = re.exec(s)) !== null){
        lastIdx = m.index;
        lastLen = m[0].length;
      }
      return { idx: lastIdx, len: lastLen };
    }

    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };

      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];

      // 优先按“每行一个 URL”的方式解析，允许 URL 中包含空格
      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')){
          urls.push(line);
        }else{
          // 兼容同一行包含多个 URL 的情况
          const matches = extractUrlsLoose(line);
          for(const u of matches){
            urls.push(u);
          }
        }
      }

      // 去重保序 + 过滤图片链接
      const seen = new Set();
      const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized)) continue;
        if(seen.has(normalized)) continue;
        seen.add(normalized);
        images.push(normalized);
      }
      return { text: before, images };
    }

    function shouldShowImagesByAnswer(answerText){
      const t = String(answerText || '');
      // 常见“需要看图/见图/如下图”的表述
      const keywords = [
        '如图', '如下图', '见图', '见下图', '下图', '上图',
        '图片', '示意图', '结构图', '外观', '接线图', '电路图', '原理图', '安装图', '尺寸图', '截图'
      ];
      return keywords.some(k => t.includes(k));
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
        : [];
      const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;
      
      // 使用宽松提取
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
      
      // 只要后端给了候选图片，就展示（避免答案没写“如图”但用户仍需要看图）
      // 或者从文本里提取到了图片 URL
      const shouldShow = hasBlockImages || (candidates.length > 0) || (looseImages.length > 0);
      
      // 优先级：Block 显式标记 > 后端候选 > 文本宽松提取
      // 注意：这里做个并集可能更好，防止漏掉
      const allImages = new Set([
          ...(hasBlockImages ? imagesFromBlock : []),
          ...candidates,
          ...looseImages
      ]);
      const images = Array.from(allImages);

      containerEl.textContent = '';

      if((text || '').trim().length > 0){
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = text;
        containerEl.appendChild(textEl);
      }else{
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = '（已完成，但未返回答案）';
        containerEl.appendChild(textEl);
      }

      if(images && images.length > 0){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        for(const url of images){
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = safeUrl;
          img.alt = '参考图片';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => {
            img.style.display = 'none';
          });
          imgWrap.appendChild(img);

          const link = document.createElement('a');
          link.href = safeUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = url;
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }

    function addUserMsg(text){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addUserMsgWithTime(text, ts){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls){
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">小度</div>
          <div>
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      const el = document.getElementById(id);
      if(el){
        const answerEl = el.querySelector('.answer');
        renderAnswerWithImages(answerEl, text || '', imageUrls || []);
      }
      scrollToBottom();
    }

    function addBotMsgSkeleton(){
      const id = 'bot-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">小度</div>
          <div style="min-width: 180px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary>阶段进度（等待中）</summary>
                <ul></ul>
              </details>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status){
      const details = botMsgEl.querySelector('details.progress');
      const summary = details.querySelector('summary');
      const ul = details.querySelector('ul');
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];
      const totalDone = done.length;
      const totalRun = running.length;

      const statusMap = {
        'processing': '处理中',
        'completed': '已完成',
        'failed': '失败',
        'pending': '等待中',
      };
      const displayStatus = statusMap[status] || status || 'unknown';

      summary.textContent = `阶段进度（已完成${totalDone}，进行中${totalRun}，状态：${displayStatus}）`;

      const lines = [
        ...done.map(x => `✅ ${x}`),
        ...running.map(x => `⏳ ${x}`)
      ];
      ul.innerHTML = '';
      if(lines.length === 0){
        ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
      }else{
        for(const line of lines){
          ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
        }
      }
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('details.progress');
      const err = (error || '').trim();

      if(err){
        const progressEl = progress ? progress : null;
        if(progressEl) {
            progressEl.remove();
            progressEl.removeAttribute('open');
        }
        bubble.textContent = '';
        const errEl = document.createElement('div');
        errEl.className = 'answer';
        errEl.textContent = `抱歉，本次处理失败：\n${err}`;
        bubble.appendChild(errEl);
        if(progressEl) bubble.appendChild(progressEl);
        return;
      }

      const progressEl = progress ? progress : null;
      if(progressEl) {
        progressEl.remove();
        progressEl.removeAttribute('open'); // 完成后自动收起
      }
      bubble.textContent = '';
      const answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.appendChild(answerEl);
      renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
      if(progressEl) bubble.appendChild(progressEl);
    }

    async function apiHealth(){
      try{
        const res = await fetch(`${API_BASE}/health`);
        if(!res.ok) throw new Error('health not ok');
        apiPill.textContent = `API: 已连接`;
        apiPill.classList.add('ok');
        apiPill.classList.remove('bad');
      }catch(e){
        apiPill.textContent = `API: 未连接`;
        apiPill.classList.add('bad');
        apiPill.classList.remove('ok');
      }
    }

    async function loadHistory(){
      try{
        const res = await fetch(`${API_BASE}/history/${sessionId}`);
        if(!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if(items.length === 0) return;
        // 兜底：按时间正序展示（即使服务端返回倒序，也不会出现"回答排在提问前面"）
        if(items.every(it => Number.isFinite(Number(it.ts)))){
          items.sort((a, b) => Number(a.ts) - Number(b.ts));
        }
        // 保留欢迎语（data-welcome 标记），其余先清空再渲染历史
        // 用标记而非"第 0 个"判断：避免历史上没有欢迎语时误留第一条消息
        chatEl.querySelectorAll('.msg:not([data-welcome])').forEach(el => el.remove());
        for(const item of items){
          if(item.role === 'user'){
            addUserMsgWithTime(item.text || '', item.ts);
          }else{
            addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
          }
        }
        scrollToBottom();
      }catch(_){}
    }

    async function submitQuery(text){
      const isStream = streamToggle.checked;
      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          query: text,
          session_id: sessionId,
          is_stream: isStream
        })
      });
      if(!res.ok){
        const msg = await res.text();
        throw new Error(msg || '请求失败');
      }
      return await res.json();
    }

    async function poll(taskId, botMsgEl){
      const typing = botMsgEl.querySelector('.typing');
      const interval = setInterval(async () => {
        try{
          const res = await fetch(`${API_BASE}/status/${taskId}`);
          const data = await res.json();
          renderProgress(botMsgEl, data.done_list, data.running_list, data.status);

          if(data.status === 'completed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }else if(data.status === 'failed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error || 'failed', data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }
        }catch(e){
          // 轮询错误不立刻终止，让用户稍后重试
        }
      }, 1200);
    }

    async function onSend(){
      console.log('[perf] A onSend start', performance.now());
      const text = (inputEl.value || '').trim();
      if(!text) return;
      inputEl.value = '';
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;

      try{
        const isStream = streamToggle.checked;
        console.log('[perf] B submitQuery start', performance.now(), { isStream });
        const data = await submitQuery(text);
        console.log('[perf] B submitQuery end', performance.now(), data);
        
        // 渲染初始状态
        renderProgress(botMsgEl, [], [], 'pending');

        if (!isStream) {
          // 非流式：直接拿到结果
          // data: { session_id, answer, done_list, error, message }
          renderProgress(botMsgEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
          sendBtn.disabled = false;
          return;
        }

        // 流式：SSE
        const { session_id } = data; // 此时 backend 返回 session_id
        
        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if(!answerEl){
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          bubble.insertBefore(answerEl, bubble.firstChild);
        }

        const es = new EventSource(`${API_BASE}/stream/${session_id}`);
        console.log('[perf] C EventSource created', performance.now(), { session_id });
        let rawAnswerText = '';

        es.addEventListener('progress', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
            // 当进度状态已完成时，提前结束“...”等待态
            if(d && d.status === 'completed'){
              const typing = botMsgEl.querySelector('.typing');
              if(typing) typing.remove();
              // 防止后端未发送 final 导致按钮一直禁用
              sendBtn.disabled = false;
            }
          }catch(_){}
        });

        es.addEventListener('delta', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            const delta = d.delta || '';
            if(delta){
              rawAnswerText += delta;
              // 即使后端未发送 final，也尽可能在流式过程中渲染图片
              renderAnswerWithImages(answerEl, rawAnswerText, []);
              scrollStreamAnchor(botMsgEl); // 答案开头贴顶后不再滚动
            }
          }catch(_){}
        });

        es.addEventListener('final', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          // 收起进度条
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          
          try{
            const d = JSON.parse(e.data || '{}');
            // 流式 delta 可能不包含“【图片】/图片列表”，最终包的 d.answer 才是完整答案；优先使用 d.answer
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){}
          es.close();
          sendBtn.disabled = false;
        });

        es.addEventListener('final_answer', (e) => {
           // 响应用户的 final_answer 信号，确保图片渲染
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          
          try{
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){}
          es.close();
          sendBtn.disabled = false;
        });

        es.addEventListener('error', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          // 收起进度条
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');

          try{
            const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
            rawAnswerText += `\n\n（错误：${msg}）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }catch(_){
            rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }
          es.close();
          sendBtn.disabled = false;
        });
      }catch(e){
        const bubble = botMsgEl.querySelector('.bubble');
        const progress = botMsgEl.querySelector('details.progress');
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + progress.outerHTML;
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        onSend();
      }
    });
    btnClear.addEventListener('click', async () => {
      if(!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;

      try {
        const res = await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
        if(!res.ok) {
           console.error("Failed to clear history backend, status:", res.status);
           alert('服务端清空失败，仅清空本地显示');
        }
      } catch(e) {
        console.error("Failed to clear history backend", e);
        alert('服务端清空失败，仅清空本地显示');
      }

      // 清空除欢迎语（data-welcome 标记）外的所有消息
      chatEl.querySelectorAll('.msg:not([data-welcome])').forEach(el => el.remove());
      scrollToBottom();
    });

    apiHealth(); // 仅在页面加载时检测一次（原为每 5 秒轮询，会导致 /health 刷屏，已移除）
    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
  </script>
</body>
</html>
